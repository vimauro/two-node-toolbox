---
# Prerequisites for kcli-redfish role
# Install required Python dependencies for kubernetes.core collection

- name: Enable CodeReady Builder repository
  community.general.rhsm_repository:
    name: "codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-rpms"
    state: enabled
  become: true

- name: Install EPEL repository
  dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  become: true

- name: Install Python dependencies for kubernetes.core collection
  package:
    name:
      - python-kubernetes
    state: present
  become: true
